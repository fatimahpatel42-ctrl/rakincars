<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars for sale · Rakin Cars</title>
  <meta name="description" content="Browse premium pre-owned luxury cars for sale at Rakin Cars, Mikocheni, Dar es Salaam.">
  <meta property="og:title" content="Rakin Cars · Premium Pre-Owned Luxury Cars">
  <meta property="og:description" content="Mikocheni, Dar es Salaam. Import, buy, sell and exchange quality used vehicles.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0d0f10">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("rc_theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/gate.js"></script>
</head>
<body data-page="all">
  <header id="site-header"></header>
  <main>
    <section class="page-head" style="padding-bottom:72px">
      <div class="wrap">
        <div class="kicker" data-t="hero_kicker">Mikocheni · Dar es Salaam</div>
        <h1 data-t="all_title">Cars for sale</h1>
        <form class="search filters" id="search-form" action="cars.html" method="get">
          <div><label for="f-make" data-t="f_make">Make</label><select id="f-make" name="make"></select></div>
          <div><label for="f-body" data-t="f_body">Body type</label><select id="f-body" name="body"></select></div>
          <div class="field-price"><label for="f-max" data-t="f_price">Max price (TZS)</label><select id="f-max" name="max"></select></div>
          <button class="btn btn-dark" type="submit" data-t="search">Search cars</button>
        </form>
        <div class="chips" id="chips" style="margin-top:18px"></div>
        <div class="toolbar">
          <label class="tb-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" autocomplete="off" data-ph="search_ph" placeholder="Search e.g. Prado 2019, white, RC-0143">
            <button type="button" id="q-clear" aria-label="Clear">✕</button>
          </label>
          <div class="tb-right">
            <label class="tb-check"><input type="checkbox" id="hide-sold"><span data-t="hide_sold">Hide sold</span></label>
            <label class="tb-sort"><span data-t="sort_by">Sort</span>
              <select id="sort">
                <option value="rec" data-t="sort_rec">Recommended</option>
                <option value="new" data-t="sort_new">Newest arrivals</option>
                <option value="plow" data-t="sort_plow">Price: low to high</option>
                <option value="phigh" data-t="sort_phigh">Price: high to low</option>
                <option value="year" data-t="sort_year">Year: newest first</option>
                <option value="km" data-t="sort_km">Mileage: lowest first</option>
              </select>
            </label>
          </div>
        </div>
        <p class="result-count" id="count"></p>
        <div class="cards" id="all"></div>
        <div class="more-wrap" id="more-wrap" hidden>
          <p class="more-note" id="more-note"></p>
          <div class="more-bar"><i id="more-bar"></i></div>
          <button class="btn btn-ghost" id="more" type="button" data-t="load_more">Load more cars</button>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/cars-data.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
